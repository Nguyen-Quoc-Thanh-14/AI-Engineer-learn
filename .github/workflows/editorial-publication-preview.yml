name: Editorial preview — five-volume course and answer books
on:
  push:
    branches:
      - editorial/publication-prep
    paths:
      - '40_BIEN_TAP_XUAT_BAN/**'
      - '03_HOC_PHAN/**'
      - '.github/workflows/editorial-publication-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-editorial-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - name: Install pinned layout renderer
        run: python -m pip install 'markdown==3.9'
      - name: Verify lesson inventory and editorial transformations
        run: python -m unittest discover -s 40_BIEN_TAP_XUAT_BAN -p 'test_publication.py' -v
      - name: Assemble 5 student books + 5 answer books, manifests and HTML
        run: python 40_BIEN_TAP_XUAT_BAN/build.py
      - name: Install Pandoc for EPUB3 preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc
      - name: Export 10 EPUB3 documents
        run: python 40_BIEN_TAP_XUAT_BAN/export_epub.py
      - name: Check final artifact counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, json
          p=Path("40_BIEN_TAP_XUAT_BAN/_build")
          m=json.loads((p/"manifest.json").read_text(encoding="utf8"))
          assert m["source_lessons"]==441 and m["source_chapters"]==137
          for ext in (".md",".html",".epub"):
              assert len(list(p.glob("TAP_*"+ext)))==10, ext
          with (p/"source_map.csv").open(encoding="utf8",newline="") as f:
              assert len(list(csv.DictReader(f)))==441
          assert m["status"]=="EDITORIAL_PREVIEW_NOT_RELEASED"
          print("EDITORIAL_PACKAGE_10_BOOKS_PASS",m["source_commit"])
          PY
      - name: Upload reviewable manuscripts (no public release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-course-five-volumes-editorial-PREVIEW-not-certified
          path: 40_BIEN_TAP_XUAT_BAN/_build/
          if-no-files-found: warn
