name: Issue 9 - Historic B 3.15.2 evidence (not expert review)
on:
  push:
    branches:
      - audit/issue9-content-qa
    paths:
      - 'tests/issue9_v27_b_runtime_3152.py'
      - '.github/workflows/issue9-v27-b-3152.yml'
      - '03_HOC_PHAN/**/MA_MAU/*_bai_tap_da_giai_v27.py'
      - '03_HOC_PHAN/**/BAI_HOC/*.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - name: Install required binary-only packages for historical B cases
        run: |
          python -m pip install --only-binary=:all: numpy==2.5.4 pandas==3.1.0 scikit-learn==1.9.1 opencv-python-headless==5.0.0.93 scipy fastapi httpx2==2.13.0
          python -m pip check
      - name: Run historical B source programs in isolated temporary directories
        run: python tests/issue9_v27_b_runtime_3152.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue9-historical-B-3152-not-expert-review
          path: evidence/issue9_content_qa/historical_B_3152_probe.json
          if-no-files-found: warn
