name: Actual NVIDIA CUDA hardware evidence (self-hosted only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu-evidence:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 40
    env:
      CUDA_VISIBLE_DEVICES: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - name: Capture NVIDIA hardware and verify driver access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/cuda_3152
          python -VV | tee evidence/cuda_3152/python_version.txt
          nvidia-smi | tee evidence/cuda_3152/nvidia_smi.txt
      - name: Install pinned PyTorch and require dependency health
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: torch==2.15.0
          python -m pip check | tee evidence/cuda_3152/pip_check.log
          python -m pip freeze --all | tee evidence/cuda_3152/installed_versions.txt
      - name: GPU kernels, gradients, CPU/GPU oracle and device training
        run: python tests/gpu_cuda_3152.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-cuda-cpython3152-evidence
          path: evidence/cuda_3152/
          if-no-files-found: warn
