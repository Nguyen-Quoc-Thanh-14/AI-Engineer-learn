name: CUDA GPU check (requires configured self-hosted GPU runner)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - name: Check NVIDIA driver
        run: nvidia-smi
      - name: Install pinned PyTorch wheel
        run: |
          python -m pip install --only-binary=:all: torch==2.15.0
      - name: Verify actual CUDA tensor operations
        shell: bash
        run: |
          python - <<'PY'
          import json, sys, torch
          assert sys.version_info[:3] == (3,15,2)
          assert torch.cuda.is_available(), "GPU CUDA hardware/runtime not present"
          x = torch.arange(0, 1024, device="cuda", dtype=torch.float32)
          y = (x * 3).sum()
          expected = 3 * 1023 * 1024 / 2
          assert abs(y.item() - expected) < 1.0
          torch.cuda.synchronize()
          print(json.dumps({"status":"PASS","torch":torch.__version__,
              "cuda_runtime":torch.version.cuda,
              "device":torch.cuda.get_device_name(0),
              "result":y.item()}))
          PY
