name: CPython 3.15.2 pilot - minimal
on:
  push:
    branches:
      - audit/cpython-3.15.2-four-demos
  workflow_dispatch:
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Python
        run: python --version
      - name: Check test script syntax
        run: python -m py_compile tests/verify_four.py tests/verify_free_threading.py tests/verify_dependencies.py
