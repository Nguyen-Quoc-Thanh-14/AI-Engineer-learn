name: CPython 3.15.2 pilot - four course demos
on:
  push:
    branches:
      - audit/cpython-3.15.2-four-demos
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - run: python tests/verify_four.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-four-demos
          path: evidence/four_demos.json
          if-no-files-found: warn
  windows-demo:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - run: python tests/verify_four.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-four-demos
          path: evidence/four_demos.json
          if-no-files-found: warn
  ubuntu-free-thread:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2t'
      - run: python -X gil=0 tests/verify_free_threading.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-free-thread
          path: evidence/free_threading.json
          if-no-files-found: warn
  ubuntu-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - run: python -m pip install --only-binary=:all: numpy==2.5.4 pandas==3.1.0 scikit-learn==1.9.1 torch==2.15.0 pyarrow==26.0.0
      - run: python tests/verify_dependencies.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-cpu-deps
          path: evidence/cpu_dependencies.json
          if-no-files-found: warn
