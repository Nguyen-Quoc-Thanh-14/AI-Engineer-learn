name: CPython 3.15.2 four original demos
on:
  push:
    branches:
      - audit/cpython-3.15.2-four-demos
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu-four-demos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - name: Test four original demos with output oracle
        run: python tests/verify_four.py
  windows-four-demos:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - name: Test four original demos with output oracle
        run: python tests/verify_four.py
