name: Full Python 3.15.2 course validation (536 scripts)
on:
  push:
    branches:
      - audit/full-course-536
      - audit/issue9-content-qa
    paths:
      - '03_HOC_PHAN/**'
      - '31_HOAN_THIEN_LOI_GIAI_V28/**'
      - '35_KIEM_DINH_CPYTHON_3152/**'
      - '37_KIEM_DINH_V31/**'
      - 'tests/keras_torch_runtime_3152.py'
      - '.github/workflows/full-course-3152.yml'
      # Re-evaluate all technical evidence whenever the release-gate contract changes.
      - '.github/workflows/release-readiness-3152.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-regular:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      KERAS_BACKEND: torch
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - name: Verify full course file inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          demos=list(root.glob('03_HOC_PHAN/**/MA_MAU/*_demo.py'))
          solutions=list(root.glob('31_HOAN_THIEN_LOI_GIAI_V28/*_bai_B_solution.py'))
          lessons=list(root.glob('03_HOC_PHAN/**/BAI_HOC/*.md'))
          print(f"lessons={len(lessons)}, demos={len(demos)}, solutions={len(solutions)}")
          assert len(lessons)==441 and len(demos)==441 and len(solutions)==95, "Source tree incomplete: no certification"
          PY
      - name: Install exact CPU dependency builds
        run: |
          python -m pip install --only-binary=:all: numpy==2.5.4 pandas==3.1.0 scikit-learn==1.9.1 torch==2.15.0 pyarrow==26.0.0
      - name: Build h5py 3.16.0 from source for CPython 3.15 Linux x64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/keras3152 wheelhouse
          python -VV | tee evidence/keras3152/python_version.txt
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config build-essential
          pkg-config --modversion hdf5 | tee evidence/keras3152/hdf5_system_version.txt
          python -m pip install packaging==25.0
          python -m pip wheel -v --no-binary=h5py --wheel-dir wheelhouse h5py==3.16.0 2>&1 | tee evidence/keras3152/h5py_build.log
          sha256sum wheelhouse/h5py-*.whl | tee evidence/keras3152/h5py_wheel_sha256.txt
          python - <<'PY'
          from pathlib import Path
          from packaging.utils import parse_wheel_filename
          from packaging.tags import sys_tags
          files=list(Path("wheelhouse").glob("h5py-*.whl"))
          assert len(files)==1, files
          name,version,build,tags=parse_wheel_filename(files[0].name)
          compatible=tags & set(sys_tags())
          assert str(name)=="h5py" and str(version)=="3.16.0"
          assert any(t.interpreter=="cp315" and "x86_64" in t.platform for t in compatible), compatible
          print("H5PY_BUILT_CP315", files[0], compatible)
          PY
      - name: Install complete dependencies, no --no-deps bypass; require pip check
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: packaging pillow opencv-python-headless==5.0.0.93 fastapi sqlalchemy httpx2==2.13.0 keras==3.15.1 torch==2.15.0 numpy==2.5.4 wheelhouse/h5py-*.whl 2>&1 | tee evidence/keras3152/pip_install.log
          python -m pip check 2>&1 | tee evidence/keras3152/pip_check.log
          python -m pip freeze --all | tee evidence/keras3152/pip_freeze.txt
      - name: Verify Keras PyTorch backend, real gradient, training, inference and HDF5
        run: python tests/keras_torch_runtime_3152.py
      - name: Run 536 independent demos and B-solution programs
        run: python 35_KIEM_DINH_CPYTHON_3152/run_validation.py --strict --suite all --timeout 60 --jobs 2 --output full_regular.json
      - name: Run semantic checks
        run: python 37_KIEM_DINH_V31/run_deep_validation.py --mode strict --group all --timeout 50 --output deep_regular.json
      - name: Apply full-course core CPU gate
        run: python 37_KIEM_DINH_V31/certification_gate.py --full full_regular.json --deep deep_regular.json --keras evidence/keras3152/runtime_result.json --pip-check evidence/keras3152/pip_check.log --output gate_regular.json
      - name: Retain evidence whether gate passes or fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-cpython-3152-cpu-evidence
          path: |
            full_regular.json
            deep_regular.json
            gate_regular.json
            resolved_dependencies_3152.txt
            pip_dependency_health_3152.txt
            evidence/keras3152/
            wheelhouse/h5py-*.whl
          if-no-files-found: warn
