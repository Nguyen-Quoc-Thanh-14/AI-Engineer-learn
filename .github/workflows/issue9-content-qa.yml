name: Issue 9 — 441 lesson / 95 B script triage (not expert review)
on:
  push:
    branches:
      - audit/issue9-content-qa
    paths:
      - '03_HOC_PHAN/**'
      - '31_HOAN_THIEN_LOI_GIAI_V28/**'
      - 'tests/issue9_content_inventory.py'
      - 'tests/test_issue9_security_contracts.py'
      - 'tests/test_issue9_content_inventory.py'
      - 'tests/test_issue9_orm_contracts.py'
      - 'tests/test_issue9_m0503_query_budget.py'
      - 'tests/test_issue9_f0502_lazy_import.py'
      - 'tests/test_issue9_d0601_pep695.py'
      - 'tests/test_issue9_f0203_pyproject.py'
      - 'tests/test_issue9_pd0503_parquet_roundtrip.py'
      - 'tests/test_issue9_pd0501_copy_on_write.py'
      - 'tests/test_issue9_h0501_static_lint.py'
      - 'tests/test_issue9_pa0303_entrypoint.py'
      - 'tests/test_issue9_n0202_sbom_graph.py'
      - 'tests/test_issue9_pw0202_ownership_csrf.py'
      - 'tests/test_issue9_m0603_http_sqlite.py'
      - '03_HOC_PHAN/N/N02/MA_MAU/N02.02_bai_B_*'
      - '03_HOC_PHAN/PA/PA03/LAB_CLI/**'
      - 'tests/issue9_d0602_overload_checker.py'
      - 'tests/issue9_flag_decisions.py'
      - 'tests/issue9_candidate_context.py'
      - 'tests/test_issue9_python315_features.py'
      - 'tests/test_issue9_typeform_runtime.py'
      - 'tests/test_issue9_design_practicals.py'
      - 'tests/issue9_typing_checker_compat.py'
      - '.github/workflows/issue9-content-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-441-and-95:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - name: Install Python wheel build dependencies for PA03.03 clean-install test
        run: python -m pip install 'setuptools>=75,<100' wheel
      - name: Verify PA03.03 builds and installs real console entry point
        run: python -m unittest discover -s tests -p 'test_issue9_pa0303_entrypoint.py' -v
      - name: Verify N02.02 synthetic SBOM graph and advisory remediation negative tests
        run: python -m unittest discover -s tests -p 'test_issue9_n0202_sbom_graph.py' -v
      - name: Verify PW02.02 source-bound ownership and CSRF negative tests
        run: python -m unittest discover -s tests -p 'test_issue9_pw0202_ownership_csrf.py' -v
      - name: Verify M06.03 actual HTTP integration and SQLite rollback
        run: python -m unittest discover -s tests -p 'test_issue9_m0603_http_sqlite.py' -v
      - name: Install ORM dependency for the 2 actual ORM/migration exercises
        run: python -m pip install 'sqlalchemy>=2.0,<3'
      - name: Install supported Hypothesis and PyArrow to verify runnable B design exercises
        run: python -m pip install 'hypothesis>=6,<7' 'pyarrow==26.0.0' 'pandas==3.1.0'
      - name: Verify PD05.01 pandas 3.x Copy-on-Write behavior
        run: python -m unittest discover -s tests -p 'test_issue9_pd0501_copy_on_write.py' -v
      - name: Verify H06 shrinking, PE02 Parquet schema and PS02 sensor timezone/units
        run: python -m unittest discover -s tests -p 'test_issue9_design_practicals.py' -v
      - name: Independently verify N02/F04 exercise B semantics
        run: python -m unittest discover -s tests -p 'test_issue9_security_contracts.py' -v
      - name: Verify actual ORM and versioned FK migration under SQLite
        run: python -m unittest discover -s tests -p 'test_issue9_orm_contracts.py' -v
      - name: Verify M05.03 actual SQL SELECT budget and N+1 counterexample
        run: python -m unittest discover -s tests -p 'test_issue9_m0503_query_budget.py' -v
      - name: Verify CPython 3.15.2 eager and lazy import side effects for F05.02
        run: python -m unittest discover -s tests -p 'test_issue9_f0502_lazy_import.py' -v
      - name: Verify D06.01 exact PEP 695 generic syntax and runtime contract
        run: python -m unittest discover -s tests -p 'test_issue9_d0601_pep695.py' -v
      - name: Verify F02.03 actual pyproject.toml disk roundtrip
        run: python -m unittest discover -s tests -p 'test_issue9_f0203_pyproject.py' -v
      - name: Verify PD05.03 actual Parquet nullable/timestamp roundtrip
        run: python -m unittest discover -s tests -p 'test_issue9_pd0503_parquet_roundtrip.py' -v
      - name: Install type checkers for D06.02/D06.03 compatibility classification
        run: python -m pip install 'mypy>=2.4,<3' pyright ruff
      - name: Verify H05.01 real Ruff/Pyright positive and negative source cases
        run: python -m unittest discover -s tests -p 'test_issue9_h0501_static_lint.py' -v
      - name: Verify D06.02 overloads with mypy and pyright positive/negative cases
        run: python tests/issue9_d0602_overload_checker.py
      - name: Verify D06.03 runtime TypedDict extra_items and TypeForm
        run: python -m unittest discover -s tests -p 'test_issue9_typeform_runtime.py' -v
      - name: Observe mypy and pyright D06.03 positive/negative fixture acceptance
        run: python tests/issue9_typing_checker_compat.py
      - name: Verify J07.01 CPython 3.15 lazy, frozendict and sentinel
        run: python -m unittest discover -s tests -p 'test_issue9_python315_features.py' -v
      - name: Verify triage detects real source-integrity failures
        run: python -m unittest discover -s tests -p 'test_issue9_content_inventory.py' -v
      - name: Scan all 441 lessons and all 95 standalone B programs
        run: python tests/issue9_content_inventory.py
      - name: Generate source-hashed manual worklist for all flagged lessons
        run: python tests/issue9_flag_decisions.py
      - name: Generate evidence-readable 107-candidate context (not semantic certification)
        run: python tests/issue9_candidate_context.py
      - name: Verify report JSON
        run: python -m json.tool evidence/issue9_content_qa/summary.json > /dev/null
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue9-full-course-source-snapshot-for-manual-audit
          path: |
            03_HOC_PHAN/
            31_HOAN_THIEN_LOI_GIAI_V28/
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue9-441-lessons-95-B-TRIAGE-not-certification
          path: evidence/issue9_content_qa/
          if-no-files-found: warn
