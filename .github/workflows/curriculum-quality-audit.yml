name: Structural QA for 441 lessons - not independent expert certification
on:
  push:
    branches:
      - audit/full-course-536
      - audit/issue9-content-qa
    paths:
      - 'tests/curriculum_quality_audit.py'
      - 'tests/gpu_cuda_3152.py'
      - 'tests/independent_review_gate.py'
      - '03_HOC_PHAN/**'
      - 'docs/review/**'
      - '.github/workflows/curriculum-quality-audit.yml'
      # Re-evaluate all technical evidence whenever the release-gate contract changes.
      - '.github/workflows/release-readiness-3152.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-441:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - name: Check source integrity and generate risk signals for each of 441 lessons
        run: python tests/curriculum_quality_audit.py
      - name: Parse the CUDA hardware test and peer-review evidence gate (not running CUDA)
        run: python -m py_compile tests/gpu_cuda_3152.py tests/independent_review_gate.py
      - name: Validate review manifest gate correctly in either state (without academic approval)
        shell: bash
        run: |
          set +e
          python tests/independent_review_gate.py
          gate_rc=$?
          set -e
          GATE_RETURN_CODE="$gate_rc" python - <<'PY'
          import json
          import os
          from pathlib import Path
          report=json.loads(Path("evidence/independent_review_gate.json").read_text(encoding="utf8"))
          state=report["review_manifest_state"]
          rc=int(os.environ["GATE_RETURN_CODE"])
          assert report["academic_certification"]=="NOT_GRANTED_AUTOMATICALLY"
          assert (state=="EVIDENCE_PENDING" and rc==3) or (
              state=="RECORDS_COMPLETE_NEEDS_HUMAN_IDENTITY_CHECK" and rc==0
          ), (state,rc)
          # This assertion is about machine-parsable records, not verified human qualifications.
          print("REVIEW_MANIFEST_STATE_CONSISTENT",state)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-441-structural-audit-not-peer-review
          path: |
            evidence/curriculum_quality/
            evidence/independent_review_gate.json
          if-no-files-found: warn
