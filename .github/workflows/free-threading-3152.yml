name: CPython 3.15.2t free-threaded verification
on:
  push:
    branches:
      - audit/cpython-3.15.2-four-demos
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2t'
      - run: python -X gil=0 tests/verify_free_threading.py
